@if(lastMessage != null){
    <div class="alert alert-info p-2 text-center alert-dismissible fade show" role="alert" [class.bg-danger]="lastMessage.error">
        <h4>{{lastMessage.text}}</h4>
        <button type="button" class="btn-close"  aria-label="Close" (click)="closeBtn()"></button>
    </div>
}
