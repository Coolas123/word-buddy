@if(lastMessage != null){
    <div class="alert alert-info p-2 text-center alert-dismissible fade show" role="alert" [class.bg-danger]="lastMessage.error">
        <h4>{{lastMessage.text}}</h4>
        <button type="button" class="btn-close" (click)="closeBtn()"></button>
        <button (click)="YesBtn()" class="btn btn-success">Остаться</button>
        <button (click)="NoBtn()" class="btn btn-danger">Не сохранять</button>
    </div>
}
